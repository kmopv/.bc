# Data backup sources (space-separated; ~ expands)
DATA_SOURCES=(
    "$HOME/Desktop"
    "$HOME/Documents"
    "$HOME/Pictures"
)

# Exclude patterns for rsync (e.g., "*.tmp" "Cache/")
DATA_EXCLUDE=(
    "*.tmp"
    ".cache/"
)

# Size limit in MB (skip if source folder > this)
SIZE_LIMIT_MB=20

# Backup destination root (must exist)
DATA_DEST="/b"

# Config repo location
CONFIG_REPO="$HOME/.bc/configs"
CONFIG_FILELIST="$HOME/.bc/c/tracked-files.txt"

# Git remote (optional – push if set)
GIT_REMOTE="origin"   # e.g., git@github.com:user/dotfiles.git
