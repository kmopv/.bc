# Data backup sources — UNCAPPED (no size limit)
DATA_SOURCES=(
    "$HOME/Desktop"
    "$HOME/Documents"
    "$HOME/Pictures"
)

# Data backup sources — CAPPED at SIZE_LIMIT_MB
# Anything listed here gets skipped if it exceeds SIZE_LIMIT_MB
DATA_SOURCES_CAPPED=(
)

# Size limit in MB for entries in DATA_SOURCES_CAPPED
SIZE_LIMIT_MB=20

# Exclude patterns for rsync
DATA_EXCLUDE=(
    "*.tmp"
    ".cache/"
)

# Backup destination root
DATA_DEST="/b"

# Config repo
CONFIG_REPO="$HOME/.bc/c"
CONFIG_FILELIST="$CONFIG_REPO/tracked-files.txt"

# Git remotes (space-separated)
GIT_REMOTES="origin"
